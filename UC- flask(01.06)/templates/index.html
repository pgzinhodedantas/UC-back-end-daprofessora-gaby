<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <title>Inscrição - Campeonato de Games</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 640px; margin: 40px auto; }
    .msg.error { color: #a00; }
    .msg.success { color: #080; }
    label { display:block; margin-top:10px; }
    input, select { width:100%; padding:8px; box-sizing:border-box; }
  </style>
</head>
<body>
  <h1>Inscrição para Campeonato de Games</h1>

  {% if message %}
    <p class="msg {{ message_type }}">{{ message }}</p>
  {% endif %}

  <form method="post" action="/">
    <label for="nickname">Nickname</label>
    <input id="nickname" name="nickname" type="text" minlength="4" required>

    <label for="game">Jogo escolhido</label>
    <select id="game" name="game" required>
      <option value="">-- selecione --</option>
      <option>League of Legends</option>
      <option>Valorant</option>
      <option>Counter-Strike</option>
      <option>FIFA</option>
    </select>

    <label for="email">E-mail</label>
    <input id="email" name="email" type="email" required>

    <label>
      <input type="checkbox" name="rules" value="accepted" required>
      Aceito as regras
    </label>

    <button type="submit">Enviar inscrição</button>
  </form>
</body>
</html>
